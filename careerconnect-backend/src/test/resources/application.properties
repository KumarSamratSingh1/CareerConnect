# Tests do not require a live MySQL instance (no entities in Phase 0).
spring.autoconfigure.exclude=\
org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.seeder.demo.enabled=false

