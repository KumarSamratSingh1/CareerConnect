spring.application.name=careerconnect-backend
server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# MySQL — set these in the environment (or a local .env you do not commit).
# Defaults are local-dev placeholders only, not production credentials.
#
#   DB_URL        e.g. jdbc:mysql://localhost:3306/careerconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#   DB_USERNAME   e.g. root
#   DB_PASSWORD   your local password
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careerconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate — development (schema updates when entities are added later)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# CORS — comma-separated origins for a future React app (CRA :3000, Vite :5173)
# Override with CORS_ALLOWED_ORIGINS if the frontend uses another port.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# JWT -- JWT_SECRET is required in production and must be a Base64-encoded secret of at least
# 32 bytes for HS256. A default dev secret is provided as a fallback for local development.
app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Initial admin is created only when both values are supplied through the environment.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Google OAuth Client ID for server-side token verification
app.google.client-id=${GOOGLE_CLIENT_ID:178751481540-3o44nunabbkq9e3h97hh1ie78m2tq1fl.apps.googleusercontent.com}

# Multipart / File Upload Settings (10MB Max for Resume Uploads)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${RESUME_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${RESUME_MAX_REQUEST_SIZE:10MB}

# Resume Intelligence Configuration
app.resume.max-file-size-bytes=${RESUME_MAX_FILE_SIZE_BYTES:10485760}
app.resume.max-extracted-characters=${RESUME_MAX_EXTRACTED_CHARACTERS:100000}

# Resume Intelligence AI Enhancement (RI-2)
app.resume.ai.enabled=${RESUME_AI_ENABLED:false}
app.resume.ai.provider=${RESUME_AI_PROVIDER:gemini}
app.resume.ai.api-key=${RESUME_AI_API_KEY:}
app.resume.ai.model=${RESUME_AI_MODEL:gemini-3.8-flash}
app.resume.ai.base-url=${RESUME_AI_BASE_URL:https://generativelanguage.googleapis.com}
app.resume.ai.timeout-ms=${RESUME_AI_TIMEOUT_MS:8000}


